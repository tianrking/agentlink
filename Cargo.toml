[package]
name = "a-tunnel"
version = "0.1.0"
edition = "2024"
description = "Agent-native SSH tunnel MVP"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
strip-ansi-escapes = "0.2"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "net", "sync"] }
